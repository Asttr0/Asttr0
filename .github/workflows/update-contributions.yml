name: Refresh profile telemetry

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate contribution telemetry
        run: python tools/gen_contributions.py
      - name: Commit refreshed asset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile telemetry [skip ci]"
          file_pattern: assets/contributions.svg
