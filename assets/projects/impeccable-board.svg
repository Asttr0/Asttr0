<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" width="550" height="300" role="img" aria-label="Impeccable Board project card">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#100d1d"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#c4b5fd" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}
      .eyebrow{fill:#c4b5fd;font-size:12px;font-weight:700;letter-spacing:2px}
      .name{fill:#f4f4f5;font-size:29px;font-weight:800}
      .desc{fill:#a1a1aa;font-size:15px} .tag{fill:#d4d4d8;font-size:10px;font-weight:700}
      .icon{fill:none;stroke:#c4b5fd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);animation:float 4.8s ease-in-out infinite}
      .edge{animation:trace 4s linear infinite} .dot{animation:pulse 2.2s ease-in-out infinite}
      @keyframes trace{to{stroke-dashoffset:-180}} @keyframes float{50%{transform:translateY(-6px)}}
      @keyframes pulse{50%{opacity:.35}} @media (prefers-reduced-motion:reduce){.icon,.edge,.dot{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="548" height="298" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <path class="edge" d="M18 2H532" stroke="url(#edge)" stroke-width="3" stroke-dasharray="90 90"/>
  <circle class="dot" cx="38" cy="38" r="4" fill="#c4b5fd" filter="url(#glow)"/>
  <text x="52" y="43" class="eyebrow">FEATURED / 02</text>
  <g class="icon"><rect x="390" y="52" width="72" height="72" rx="12"/><path d="M407 73h38M407 89h25M407 105h31"/></g>
  <text x="34" y="112" class="name">Impeccable Board</text>
  <text x="34" y="159" class="desc">End-to-end encrypted</text>
  <text x="34" y="182" class="desc">collaborative decision space</text>
  <rect x="34" y="236" width="95" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#c4b5fd" stroke-opacity=".28"/><text x="81.5" y="254" text-anchor="middle" class="tag">TYPESCRIPT</text><rect x="139.0" y="236" width="52" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#c4b5fd" stroke-opacity=".28"/><text x="165.2" y="254" text-anchor="middle" class="tag">E2EE</text><rect x="201.4" y="236" width="95" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#c4b5fd" stroke-opacity=".28"/><text x="248.9" y="254" text-anchor="middle" class="tag">WEBSOCKETS</text>
</svg>