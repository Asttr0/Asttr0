<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" width="550" height="300" role="img" aria-label="tracks4hacks project card">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#100d1d"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#a7f3d0" stop-opacity="0"/><stop offset=".5" stop-color="#a7f3d0"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}
      .eyebrow{fill:#a7f3d0;font-size:12px;font-weight:700;letter-spacing:2px}
      .name{fill:#f4f4f5;font-size:29px;font-weight:800}
      .desc{fill:#a1a1aa;font-size:15px} .tag{fill:#d4d4d8;font-size:10px;font-weight:700}
      .icon{fill:none;stroke:#a7f3d0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);animation:float 4.8s ease-in-out infinite}
      .edge{animation:trace 4s linear infinite} .dot{animation:pulse 2.2s ease-in-out infinite}
      @keyframes trace{to{stroke-dashoffset:-180}} @keyframes float{50%{transform:translateY(-6px)}}
      @keyframes pulse{50%{opacity:.35}} @media (prefers-reduced-motion:reduce){.icon,.edge,.dot{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="548" height="298" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <path class="edge" d="M18 2H532" stroke="url(#edge)" stroke-width="3" stroke-dasharray="90 90"/>
  <circle class="dot" cx="38" cy="38" r="4" fill="#a7f3d0" filter="url(#glow)"/>
  <text x="52" y="43" class="eyebrow">FEATURED / 03</text>
  <g class="icon"><path d="M385 111c25-55 48 31 72-25s42 16 62-17"/><circle cx="385" cy="111" r="5"/><circle cx="457" cy="86" r="5"/><circle cx="519" cy="69" r="5"/></g>
  <text x="34" y="112" class="name">tracks4hacks</text>
  <text x="34" y="159" class="desc">Real-time correlation from</text>
  <text x="34" y="182" class="desc">offensive action to telemetry</text>
  <rect x="34" y="236" width="60" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#a7f3d0" stroke-opacity=".28"/><text x="63.8" y="254" text-anchor="middle" class="tag">REACT</text><rect x="103.5" y="236" width="95" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#a7f3d0" stroke-opacity=".28"/><text x="151.0" y="254" text-anchor="middle" class="tag">TYPESCRIPT</text><rect x="208.5" y="236" width="102" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#a7f3d0" stroke-opacity=".28"/><text x="259.6" y="254" text-anchor="middle" class="tag">SSE / WEBGL</text>
</svg>