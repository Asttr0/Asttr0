<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Cathode terminal introduction for Mohamed Taha Slimani">
  <defs>
    <radialGradient id="glass" cx="50%" cy="42%" r="76%">
      <stop offset="0" stop-color="#102015"/>
      <stop offset="0.68" stop-color="#07100a"/>
      <stop offset="1" stop-color="#020503"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ffc0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8ffc0" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#b8ffc0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.22"/>
    </pattern>
    <filter id="phosphor" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="18" y="18" width="864" height="384" rx="30"/></clipPath>
    <style>
      text{font-family:ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace}
      .label{fill:#f4c76b;font-size:14px;font-weight:700;letter-spacing:1.4px}
      .value{fill:#9df7a7;font-size:16px;filter:url(#phosphor)}
      .sweep{animation:sweepDown 5.8s linear infinite}
      .screenGlow{animation:flicker 8s steps(1,end) infinite}
      @keyframes sweepDown{0%{transform:translateY(-90px)}100%{transform:translateY(500px)}}
      @keyframes flicker{0%,18%,22%,61%,64%,100%{opacity:1}20%,63%{opacity:.965}}
      @media (prefers-reduced-motion:reduce){.sweep,.screenGlow{animation:none}}
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="418" rx="38" fill="#171712" stroke="#35362e" stroke-width="2"/>
  <rect x="11" y="11" width="878" height="398" rx="34" fill="#080a07" stroke="#252a22" stroke-width="5"/>
  <g clip-path="url(#screen)" class="screenGlow">
    <rect x="18" y="18" width="864" height="384" rx="30" fill="url(#glass)"/>
    <ellipse cx="450" cy="205" rx="440" ry="207" fill="none" stroke="#9df7a7" stroke-opacity="0.055" stroke-width="18"/>

    <text x="48" y="56" fill="#5b9b62" font-family="ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2">COOL-RETRO PROFILE TERMINAL  /  CRT-01</text>
    <circle cx="846" cy="51" r="5" fill="#9df7a7" filter="url(#phosphor)">
      <animate attributeName="opacity" values="1;.45;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="829" y="56" text-anchor="end" fill="#5b9b62" font-family="ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace" font-size="11">ONLINE</text>
    <line x1="48" y1="75" x2="852" y2="75" stroke="#5b9b62" stroke-opacity="0.42"/>

    <g opacity="1">
      <text x="48" y="91" fill="#d5ffd8" font-family="ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace" font-size="13">PROFILE.EXE loaded successfully</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0250;0.0336;1" dur="14.0s" repeatCount="indefinite"/>
    </g>
    <g opacity="1"><text x="48" y="108" class="label">NAME</text><text x="170" y="108" class="value">Mohamed Taha Slimani</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0786;0.0871;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="137" class="label">ROLE</text><text x="170" y="137" class="value">Software Engineering Student</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1129;0.1214;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="166" class="label">LOCATION</text><text x="170" y="166" class="value">Morocco</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1471;0.1557;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="213" class="label">ABOUT</text><text x="170" y="213" class="value">I learn by building software and understanding how</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1814;0.1900;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="170" y="242" class="value">systems fit together, fail, and improve.</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2157;0.2243;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="271" class="label">FOCUS</text><text x="170" y="271" class="value">algorithms · software design · secure applications</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2500;0.2586;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="300" class="label">BUILDING</text><text x="170" y="300" class="value">practical tools for real cybersecurity problems</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2843;0.2929;1" dur="14.0s" repeatCount="indefinite"/></g><g opacity="1"><text x="48" y="329" class="label">MINDSET</text><text x="170" y="329" class="value">curious · consistent · always learning</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3186;0.3271;1" dur="14.0s" repeatCount="indefinite"/></g>

    <g opacity="1">
      <text x="48" y="374" fill="#5b9b62" font-family="ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace" font-size="14">READY</text>
      <rect x="102" y="359" width="10" height="18" fill="#9df7a7" filter="url(#phosphor)">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3743;0.3829;1" dur="14.0s" repeatCount="indefinite"/>
    </g>

    <rect x="18" y="18" width="864" height="384" fill="url(#scanlines)" opacity="0.58"/>
    <rect class="sweep" x="18" y="0" width="864" height="90" fill="url(#sweep)"/>
  </g>
</svg>