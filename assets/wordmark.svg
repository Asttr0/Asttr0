<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Animated neon ASCII wordmark reading ASTTR0">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#030407"/><stop offset=".5" stop-color="#070712"/><stop offset="1" stop-color="#030407"/></linearGradient>
    <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".52" stop-color="#d8b4fe"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="reveal"><rect x="35" y="30" height="205" width="930"><animate attributeName="width" from="0" to="930" dur="1.35s" fill="freeze"/></rect></clipPath>
    <style>
      .ascii{font-family:ui-monospace,'JetBrains Mono','Fira Code','Cascadia Mono',Menlo,Consolas,monospace;font-size:19px;font-weight:800;fill:url(#ink);filter:url(#glow);letter-spacing:.5px}
      .art{animation:hover 5.2s ease-in-out infinite,flicker 9s steps(1,end) infinite;transform-origin:center}
      .ghostA{fill:#22d3ee;opacity:.15} .ghostB{fill:#a78bfa;opacity:.12}
      .trail{fill:none;stroke:#67e8f9;stroke-width:1;stroke-opacity:.16;stroke-dasharray:10 18;animation:flow 8s linear infinite}
      .t1,.t4,.t7{animation-duration:11s;stroke:#a78bfa} .t2,.t5,.t8{animation-duration:6.5s;stroke:#a7f3d0}
      .beam{animation:scan 4.6s ease-in-out infinite}
      @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes flicker{0%,17%,19%,53%,55%,100%{opacity:1}18%,54%{opacity:.82}}
      @keyframes flow{to{stroke-dashoffset:-224}}
      @keyframes scan{0%,12%{transform:translateX(-280px);opacity:0}35%{opacity:1}72%,100%{transform:translateX(1180px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.art,.trail,.beam{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="268" rx="18" fill="url(#bg)" stroke="#27243c"/>
  <g><path d="M -160 25 L 180 25 L 260 -3" class="trail t0"/><path d="M -183 49 L 238 49 L 318 21" class="trail t1"/><path d="M -206 73 L 296 73 L 376 45" class="trail t2"/><path d="M -229 97 L 354 97 L 434 69" class="trail t3"/><path d="M -252 121 L 412 121 L 492 93" class="trail t4"/><path d="M -275 145 L 470 145 L 550 117" class="trail t5"/><path d="M -298 169 L 528 169 L 608 141" class="trail t6"/><path d="M -321 193 L 586 193 L 666 165" class="trail t7"/><path d="M -344 217 L 644 217 L 724 189" class="trail t8"/><path d="M -367 241 L 702 241 L 782 213" class="trail t9"/></g>
  <g clip-path="url(#reveal)">
    <g transform="translate(8 8)" class="ghostB"><text x="500" y="72" text-anchor="middle" xml:space="preserve" class="ascii r0">  @@@@@@     @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@       @@@@@@  </text><text x="500" y="96" text-anchor="middle" xml:space="preserve" class="ascii r1">##      ##   ##               ##           ##       ##      ##   ##      ##</text><text x="500" y="120" text-anchor="middle" xml:space="preserve" class="ascii r2">%%      %%   %%               %%           %%       %%      %%   %%    %%%%</text><text x="500" y="144" text-anchor="middle" xml:space="preserve" class="ascii r3">**********   ********         **           **       ********     **  **  **</text><text x="500" y="168" text-anchor="middle" xml:space="preserve" class="ascii r4">++      ++           ++       ++           ++       ++  ++       ++++    ++</text><text x="500" y="192" text-anchor="middle" xml:space="preserve" class="ascii r5">==      ==           ==       ==           ==       ==    ==     ==      ==</text><text x="500" y="216" text-anchor="middle" xml:space="preserve" class="ascii r6">@@      @@   @@@@@@@@         @@           @@       @@      @@     @@@@@@  </text></g>
    <g transform="translate(4 4)" class="ghostA"><text x="500" y="72" text-anchor="middle" xml:space="preserve" class="ascii r0">  @@@@@@     @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@       @@@@@@  </text><text x="500" y="96" text-anchor="middle" xml:space="preserve" class="ascii r1">##      ##   ##               ##           ##       ##      ##   ##      ##</text><text x="500" y="120" text-anchor="middle" xml:space="preserve" class="ascii r2">%%      %%   %%               %%           %%       %%      %%   %%    %%%%</text><text x="500" y="144" text-anchor="middle" xml:space="preserve" class="ascii r3">**********   ********         **           **       ********     **  **  **</text><text x="500" y="168" text-anchor="middle" xml:space="preserve" class="ascii r4">++      ++           ++       ++           ++       ++  ++       ++++    ++</text><text x="500" y="192" text-anchor="middle" xml:space="preserve" class="ascii r5">==      ==           ==       ==           ==       ==    ==     ==      ==</text><text x="500" y="216" text-anchor="middle" xml:space="preserve" class="ascii r6">@@      @@   @@@@@@@@         @@           @@       @@      @@     @@@@@@  </text></g>
    <g class="art"><text x="500" y="72" text-anchor="middle" xml:space="preserve" class="ascii r0">  @@@@@@     @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@@@   @@@@@@@@       @@@@@@  </text><text x="500" y="96" text-anchor="middle" xml:space="preserve" class="ascii r1">##      ##   ##               ##           ##       ##      ##   ##      ##</text><text x="500" y="120" text-anchor="middle" xml:space="preserve" class="ascii r2">%%      %%   %%               %%           %%       %%      %%   %%    %%%%</text><text x="500" y="144" text-anchor="middle" xml:space="preserve" class="ascii r3">**********   ********         **           **       ********     **  **  **</text><text x="500" y="168" text-anchor="middle" xml:space="preserve" class="ascii r4">++      ++           ++       ++           ++       ++  ++       ++++    ++</text><text x="500" y="192" text-anchor="middle" xml:space="preserve" class="ascii r5">==      ==           ==       ==           ==       ==    ==     ==      ==</text><text x="500" y="216" text-anchor="middle" xml:space="preserve" class="ascii r6">@@      @@   @@@@@@@@         @@           @@       @@      @@     @@@@@@  </text></g>
  </g>
  <rect class="beam" x="0" y="22" width="170" height="220" fill="url(#beam)" opacity="0"/>
  <line x1="68" y1="244" x2="932" y2="244" stroke="#67e8f9" stroke-opacity=".18"/>
</svg>